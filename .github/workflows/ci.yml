name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Ban check - no trademarked terms
        run: |
          if grep -r -i "Jolly" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.html" --include="*.css" --include="*.md" src/ public/ index.html; then
            echo "ERROR: Found banned word in source files"
            exit 1
          fi
          echo "Ban check passed"
